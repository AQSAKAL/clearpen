[package]
name = "clearpen"
version = "0.1.0"
description = "Clearpen for Mac and Windows"
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's, which
# Cargo needs on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "clearpen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: images in the library folder are shown through asset:// URLs
# unstable: the multiwebview API, for Telegram, WhatsApp and Brave beside the page
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# unsafe-headers: lets the app send no Origin to Ollama (see src/main.ts)
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
# The integrated terminal: a pseudo-terminal per tab, streamed to xterm.js.
portable-pty = "0.9"
# The file explorer's parallel walk: fast path search without an index.
ignore = "0.4"
# The event hub's broadcast channel.
tokio = { version = "1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# Closing a tab ends the whole process group (the shell and opencode), not just
# the shell.
libc = "0.2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
# API keys in the operating system's credential store: the Mac's Keychain,
# Windows Credential Manager, or the Linux Secret Service.
keyring = "4"

# Small binaries: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
