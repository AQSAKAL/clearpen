[package]
name = "clearpen"
version = "0.1.0"
description = "Clearpen for Mac and Windows"
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's, which
# Cargo needs on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "clearpen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: images in the library folder are shown through asset:// URLs
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# unsafe-headers: lets the app send no Origin to Ollama (see src/main.ts)
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

# Small binaries: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
